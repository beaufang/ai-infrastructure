# RSS 订阅简报生成器配置文件
# 将此文件复制为 .claude/rss-config.yaml

# RSS 订阅源列表
sources:
  # 示例：技术博客
  - name: "阮一峰的网络日志"
    url: "https://www.ruanyifeng.com/blog/atom.xml"
    category: "技术"

  # 示例：新闻资讯
  - name: "Hacker News"
    url: "https://news.ycombinator.com/rss"
    category: "新闻"

  # 添加更多 RSS 源...
  # - name: "源名称"
  #   url: "https://example.com/rss"
  #   category: "分类"

# Twitter/X 书签配置
twitter:
  enabled: false           # 是否启用书签获取（需安装 opencli）
  bookmark_limit: 50       # 拉取书签数量
  fetch_articles: true     # 是否获取长文推文的完整内容

# 输出配置
output:
  directory: "project/rss"  # 输出目录（相对于项目根目录）

# 内容配置
content:
  max_articles_per_source: 50  # 每个源最多获取的文章数

# 去重配置
dedup:
  enabled: true  # 是否启用去重

# AI 总结配置
ai_summary:
  enabled: false

  # API 配置（OpenAI 兼容接口）
  api_key: ""                    # API 密钥
  model: "gpt-4o-mini"           # 模型名称

  # 自定义 API 地址（可选，用于 DeepSeek、月之暗面等兼容接口）
  # base_url: "https://api.deepseek.com/v1"

  # 内容获取策略
  content_strategy: "auto"       # 'rss_only' | 'fetch_full' | 'auto'
  fetch_full_min_length: 500     # RSS 内容 <500 字时自动抓取全文

  # 性能优化
  max_concurrent: 5              # 最大并发请求数

  # 每日简报配置
  briefing:
    enabled: true                  # 是否启用简报生成（需要 AI 总结已启用）

  # 主题聚类去重配置
  topic_dedup:
    enabled: true                  # 是否启用 AI 驱动的主题聚类去重
